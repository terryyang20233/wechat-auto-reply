<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>微信回复助手</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="logo" aria-hidden="true"></span>
          <div>
            <h1>微信回复助手</h1>
            <p>本机读取 · AI 给选项 · 你点了才发送</p>
          </div>
        </div>
        <div class="status-row">
          <span id="pill-ax" class="pill">辅助功能</span>
          <span id="pill-wechat" class="pill">微信</span>
          <span id="pill-ai" class="pill">AI</span>
          <button id="btn-settings" class="ghost" type="button">设置</button>
        </div>
      </header>

      <main class="layout">
        <section class="panel chat-panel">
          <div class="panel-head">
            <div>
              <h2 id="chat-name">等待读取当前聊天</h2>
              <p id="chat-note" class="muted">请打开微信，点进一个会话。</p>
            </div>
            <div class="status-row">
              <button id="btn-refresh" class="ghost" type="button">刷新</button>
              <button id="btn-permission" class="ghost" type="button">弹出授权</button>
              <button id="btn-ax-settings" class="ghost" type="button">打开系统设置</button>
            </div>
          </div>
          <div id="messages" class="messages"></div>
        </section>

        <section class="panel suggest-panel">
          <div class="panel-head">
            <div>
              <h2>回复备选</h2>
              <p class="muted">可先写「我想说的」。生成可能是 1 条，也可能拆成几条气泡；点了才会发。</p>
            </div>
            <div class="status-row">
              <button id="btn-clear-quote" class="ghost hidden" type="button" hidden>取消引用</button>
              <button id="btn-suggest" class="primary" type="button">生成建议</button>
            </div>
          </div>
          <div class="tone-picker">
            <div class="tone-label">回复语气</div>
            <div class="tone-modes" role="tablist" aria-label="回复语气">
              <button type="button" class="tone-mode is-on" data-mode="daily">日常</button>
              <button type="button" class="tone-mode" data-mode="dating">恋爱/暧昧</button>
              <button type="button" class="tone-mode" data-mode="work">职场/工作</button>
              <button type="button" class="tone-mode" data-mode="clash">怼人/防守</button>
            </div>
            <div class="tone-choices" data-mode="dating" hidden>
              <label class="tone-choice">
                <input type="radio" name="tone-opt" value="dating_tease" />
                <span>推拉/俏皮<small>制造神秘感或无害的玩笑</small></span>
              </label>
              <label class="tone-choice">
                <input type="radio" name="tone-opt" value="dating_care" />
                <span>情绪价值<small>细腻关心，但不显得舔狗</small></span>
              </label>
              <label class="tone-choice">
                <input type="radio" name="tone-opt" value="dating_open" />
                <span>延展话题<small>用开放式问题引导对方继续聊</small></span>
              </label>
            </div>
            <div class="tone-choices" data-mode="work" hidden>
              <label class="tone-choice">
                <input type="radio" name="tone-opt" value="work_efficient" />
                <span>专业高效<small>直接给方案，或确认收到</small></span>
              </label>
              <label class="tone-choice">
                <input type="radio" name="tone-opt" value="work_deflect" />
                <span>委婉拒绝/延后<small>高情商打太极，不伤和气</small></span>
              </label>
              <label class="tone-choice">
                <input type="radio" name="tone-opt" value="work_confirm" />
                <span>请示/确认<small>稳妥的下级对上级回复</small></span>
              </label>
            </div>
            <div class="tone-choices" data-mode="clash" hidden>
              <label class="tone-choice">
                <input type="radio" name="tone-opt" value="clash_sarcastic" />
                <span>阴阳怪气<small>不带脏字地怼回去</small></span>
              </label>
              <label class="tone-choice">
                <input type="radio" name="tone-opt" value="clash_distance" />
                <span>礼貌保持距离<small>冷处理，把话题收住</small></span>
              </label>
            </div>
            <p class="tone-hint" id="tone-hint">最正常的日常微信，像平时聊天，不策略、不装。</p>
            <input id="reply-tone" name="reply_tone" type="hidden" value="daily" />
          </div>
          <label class="intent-box" for="user-intent">我想说的（可选）
            <textarea id="user-intent" rows="3" maxlength="800" placeholder="例如：今晚不去了，改明天；顺便问他具体几点。会结合左侧聊天写成自然回复。"></textarea>
          </label>
          <p id="quote-banner" class="muted action-note"></p>
          <div id="suggestions" class="suggestions empty-state">
            还没有建议。读取到聊天后点「生成建议」。
          </div>
          <p id="action-note" class="muted action-note"></p>
        </section>
      </main>
    </div>

    <div id="settings-mask" class="mask hidden" role="dialog" aria-modal="true">
      <form id="settings-form" class="sheet">
        <div class="sheet-head">
          <h2>本机设置</h2>
          <button id="btn-close-settings" class="ghost" type="button">关闭</button>
        </div>
        <p class="muted">API Key 只写在你电脑的 <code>~/.wechat-assist/settings.json</code>，权限 600。聊天内容默认匿名化后再发给你自己的模型。</p>

        <label>AI 提供商
          <select name="provider" id="provider">
            <option value="gemini">Google Gemini</option>
            <option value="openai">OpenAI 兼容（OpenAI / DeepSeek / 通义等）</option>
            <option value="anthropic">Anthropic</option>
            <option value="ollama">Ollama（完全本机，推荐隐私优先）</option>
            <option value="custom">自定义 OpenAI 兼容接口</option>
          </select>
        </label>
        <label>API Key
          <input name="api_key" type="password" autocomplete="off" placeholder="Gemini 为 AIza…；OpenAI 为 sk-…" />
        </label>
        <label>API Base（可空）
          <input name="api_base" type="text" placeholder="Gemini 可留空，或填 https://generativelanguage.googleapis.com/v1beta" />
        </label>
        <label>模型
          <input name="model" type="text" placeholder="gemini-3.6-flash / gpt-4o-mini / claude-3-5-sonnet-latest" />
        </label>
        <div class="grid-2">
          <label>建议条数
            <input name="n_suggestions" type="number" min="1" max="6" />
          </label>
          <label>上下文条数
            <input name="context_messages" type="number" min="4" max="80" />
          </label>
        </div>
        <label>默认回复语气
          <select name="reply_tone">
            <option value="daily">日常（最正常）</option>
            <optgroup label="恋爱/暧昧">
              <option value="dating_tease">推拉/俏皮</option>
              <option value="dating_care">情绪价值</option>
              <option value="dating_open">延展话题</option>
            </optgroup>
            <optgroup label="职场/工作">
              <option value="work_efficient">专业高效</option>
              <option value="work_deflect">委婉拒绝/延后</option>
              <option value="work_confirm">请示/确认</option>
            </optgroup>
            <optgroup label="怼人/防守">
              <option value="clash_sarcastic">阴阳怪气</option>
              <option value="clash_distance">礼貌保持距离</option>
            </optgroup>
          </select>
        </label>
        <label>额外风格说明（可空）
          <textarea name="system_style" rows="2" placeholder="例如：少用语气词；对方用英文就回英文"></textarea>
        </label>
        <label class="check"><input name="anonymize_names" type="checkbox" /> 发给 AI 时隐藏真实姓名（推荐）</label>
        <label class="check"><input name="include_chat_name" type="checkbox" /> 把会话名称也发给 AI（一般不需要）</label>
        <label>发送方式
          <select name="send_mode">
            <option value="fill_and_send">填入并发送（仍需你点击）</option>
            <option value="fill_only">只填入输入框，由你按回车（更稳妥）</option>
          </select>
        </label>
        <div class="grid-2">
          <label>两次发送最短间隔（秒）
            <input name="min_send_interval_seconds" type="number" min="2" max="120" step="0.5" />
          </label>
          <label>每小时最多发送
            <input name="max_sends_per_hour" type="number" min="1" max="80" />
          </label>
        </div>
        <div class="sheet-actions">
          <button class="primary" type="submit">保存</button>
        </div>
      </form>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
